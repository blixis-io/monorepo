# Local Git hooks (optional convenience; CI is authoritative). Install: pnpm exec lefthook install
commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
pre-commit:
  commands:
    biome:
      glob: "*.{ts,tsx,js,mjs,cjs,json,jsonc}"
      run: pnpm exec biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
