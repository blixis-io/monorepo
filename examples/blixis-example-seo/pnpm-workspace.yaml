# Its own pnpm project, outside the monorepo's workspace: it installs Blixis from packed tarballs
# (`pnpm pack:public` at the repository root), the way a third party installs from npm.
packages: []

overrides:
  '@blixis-io/contracts': file:../../.artifacts/blixis-io-contracts-0.0.0.tgz
  '@blixis-io/kernel': file:../../.artifacts/blixis-io-kernel-0.0.0.tgz
  '@blixis-io/content-api': file:../../.artifacts/blixis-io-content-api-0.0.0.tgz
  '@blixis-io/database': file:../../.artifacts/blixis-io-database-0.0.0.tgz
  '@blixis-io/events': file:../../.artifacts/blixis-io-events-0.0.0.tgz
  '@blixis-io/graphql': file:../../.artifacts/blixis-io-graphql-0.0.0.tgz
  '@blixis-io/shared': file:../../.artifacts/blixis-io-shared-0.0.0.tgz
  '@blixis-io/testing': file:../../.artifacts/blixis-io-testing-0.0.0.tgz
  '@blixis-io/users': file:../../.artifacts/blixis-io-users-0.0.0.tgz
  '@blixis-io/spaces': file:../../.artifacts/blixis-io-spaces-0.0.0.tgz
  '@blixis-io/permissions': file:../../.artifacts/blixis-io-permissions-0.0.0.tgz
  '@blixis-io/content': file:../../.artifacts/blixis-io-content-0.0.0.tgz

# Install scripts allowed, as in the monorepo (pnpm 12 refuses unapproved ones in CI).
allowBuilds:
  esbuild: true
  workerd: true

minimumReleaseAgeExclude:
  - hono@4.13.9
