# Its own pnpm project, outside the monorepo's workspace: it installs Blixis from packed tarballs
# (`pnpm pack:public` at the repository root), the way a third party installs from npm.
packages: []

overrides:
  '@blixis-io/contracts': file:../../.artifacts/blixis-io-contracts.tgz
  '@blixis-io/kernel': file:../../.artifacts/blixis-io-kernel.tgz
  '@blixis-io/content-api': file:../../.artifacts/blixis-io-content-api.tgz
  '@blixis-io/database': file:../../.artifacts/blixis-io-database.tgz
  '@blixis-io/events': file:../../.artifacts/blixis-io-events.tgz
  '@blixis-io/graphql': file:../../.artifacts/blixis-io-graphql.tgz
  '@blixis-io/shared': file:../../.artifacts/blixis-io-shared.tgz
  '@blixis-io/testing': file:../../.artifacts/blixis-io-testing.tgz
  '@blixis-io/users': file:../../.artifacts/blixis-io-users.tgz
  '@blixis-io/spaces': file:../../.artifacts/blixis-io-spaces.tgz
  '@blixis-io/permissions': file:../../.artifacts/blixis-io-permissions.tgz
  '@blixis-io/content': file:../../.artifacts/blixis-io-content.tgz

# Install scripts allowed, as in the monorepo (pnpm 12 refuses unapproved ones in CI).
allowBuilds:
  esbuild: true
  workerd: true

minimumReleaseAgeExclude:
  - hono@4.13.9
