# Local development services (docs/operations/database.md). Credentials are local-only.
services:
  postgres:
    # Same major version as Neon (Postgres 18).
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: blixis
      POSTGRES_PASSWORD: blixis
      POSTGRES_DB: blixis
    ports:
      # Override with BLIXIS_POSTGRES_PORT if another Postgres already uses 5432.
      - "${BLIXIS_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blixis -d blixis"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  # Distinct name: an older `postgres-data` volume may exist from before the rebuild.
  postgres18-data:
