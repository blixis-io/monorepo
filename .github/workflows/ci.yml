name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Format
        run: pnpm format:check
      - name: Lint and boundaries
        run: pnpm lint
      - name: Generated Worker types are up to date
        run: pnpm --filter @blixis/api types:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Worker bundles (dry-run deploy, size gate)
        env:
          MAX_GZIP_KIB: 1024
        run: |
          for e in staging production; do
            out=$(pnpm --filter @blixis/api exec wrangler deploy --dry-run --outdir "dist/$e" --env "$e" 2>&1) || { echo "$out"; exit 1; }
            line=$(echo "$out" | grep "Total Upload")
            echo "$e: $line" | tee -a "$GITHUB_STEP_SUMMARY"
            size=$(echo "$line" | sed -E 's/.*gzip: ([0-9.]+) (KiB|MiB).*/\1 \2/')
            awk -v s="$size" -v max="$MAX_GZIP_KIB" 'BEGIN { split(s, p, " "); kib = (p[2] == "MiB") ? p[1] * 1024 : p[1];
              if (kib > max) { printf "bundle too large: %.1f KiB gzip > %d KiB\n", kib, max; exit 1 } }'
          done
      - name: Build docs site
        run: pnpm --filter @blixis/docs build
