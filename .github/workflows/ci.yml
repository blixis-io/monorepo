name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Test database (docs/conventions/testing.md#test-database): same major version as Neon.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: blixis
          POSTGRES_PASSWORD: blixis
          POSTGRES_DB: blixis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blixis -d blixis"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      BLIXIS_TEST_DATABASE_URL: postgres://blixis:blixis@localhost:5432/blixis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Format
        run: pnpm format:check
      - name: Lint and boundaries
        run: pnpm lint
      - name: Generated Worker types are up to date
        run: pnpm --filter @blixis-io/api types:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      # After Build: the generator loads the API's module list, which resolves packages from dist.
      - name: OpenAPI document is up to date (ADR 0015)
        run: pnpm openapi:check
      - name: Public API surface is reviewed (plan 018.004)
        run: pnpm api-surface:check
      - name: Worker bundles (dry-run deploy, size gate)
        env:
          MAX_GZIP_KIB: 1024
        run: |
          for e in staging production; do
            out=$(pnpm --filter @blixis-io/api exec wrangler deploy --dry-run --outdir "dist/$e" --env "$e" 2>&1) || { echo "$out"; exit 1; }
            line=$(echo "$out" | grep "Total Upload")
            echo "$e: $line" | tee -a "$GITHUB_STEP_SUMMARY"
            size=$(echo "$line" | sed -E 's/.*gzip: ([0-9.]+) (KiB|MiB).*/\1 \2/')
            awk -v s="$size" -v max="$MAX_GZIP_KIB" 'BEGIN { split(s, p, " "); kib = (p[2] == "MiB") ? p[1] * 1024 : p[1];
              if (kib > max) { printf "bundle too large: %.1f KiB gzip > %d KiB\n", kib, max; exit 1 } }'
          done
      - name: Build admin (ADR 0017)
        run: |
          pnpm --filter @blixis-io/admin build:staging
          pnpm --filter @blixis-io/admin exec wrangler deploy --dry-run --env staging
      - name: Build docs site
        run: pnpm --filter @blixis-io/docs build

  e2e:
    name: e2e (admin)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The admin's Playwright tests against the real API (wrangler dev) on a fresh database.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: blixis
          POSTGRES_PASSWORD: blixis
          POSTGRES_DB: blixis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blixis -d blixis"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://blixis:blixis@localhost:5432/blixis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Build
        run: pnpm build
      - name: Migrate
        run: pnpm db:migrate
      - name: Local API secrets (throwaway signing key)
        run: echo "AUTH_SIGNING_KEYS=$(node tooling/db/src/cli.ts generate-signing-key ci)" > apps/api/.dev.vars
      - name: Install Chromium
        run: pnpm --filter @blixis-io/admin exec playwright install --with-deps chromium
      - name: Playwright
        run: pnpm --filter @blixis-io/admin e2e
      - name: Traces of failed tests
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results
          path: apps/admin/test-results
          retention-days: 7

  extension-contract:
    name: extension contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The example plugin, installed from packed tarballs like a third-party module (§42 Stage 8,
    # §52): its tests against Postgres, and a Worker bundle with first-party modules.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: blixis
          POSTGRES_PASSWORD: blixis
          POSTGRES_DB: blixis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blixis -d blixis"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      BLIXIS_TEST_DATABASE_URL: postgres://blixis:blixis@localhost:5432/blixis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Build and pack the public packages
        run: pnpm pack:public
      - name: Example plugin (from tarballs)
        working-directory: examples/blixis-example-seo
        run: |
          pnpm install --no-frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm pack --pack-destination ../../.artifacts
          mv ../../.artifacts/blixis-example-seo-*.tgz ../../.artifacts/blixis-example-seo.tgz
      - name: Worker bundle with the plugin installed
        working-directory: examples/extension-smoke
        run: |
          pnpm install --no-frozen-lockfile
          pnpm dry-run
